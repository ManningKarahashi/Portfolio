<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manning Karahashi: Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>Stats and visualizations about this codebase.</p>

    <div id="stats"></div>

    <div style="display: flex; align-items: baseline; gap: 1em; margin-bottom: 1em;">
        <label style="display: flex; flex: 1; align-items: baseline; gap: 0.5em;">
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100" style="flex: 1;" />
            <time id="commit-time" style="margin-left: auto; white-space: nowrap;"></time>
        </label>
    </div>

    <h2>Commits by time of day</h2>

    <div id="scrolly-1">
        <div id="scatter-story">
        </div>
        <div id="scatter-plot">
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <h2>File sizes over time</h2>
    <dl id="files"></dl>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd><a href="" id="commit-link" target="_blank"></a></dd>
        <dt>Date</dt>
        <dd id="commit-date"></dd>
        <dt>Time</dt>
        <dd id="commit-time-display"></dd>
        <dt>Author</dt>
        <dd id="commit-author"></dd>
        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>
</body>
</html>
